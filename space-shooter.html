<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0620">
<title>Nova Runner — Space Shooter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0B0620;
    --bg-mid:#160B33;
    --accent-pink:#FF3E6C;
    --accent-cyan:#3FEEE0;
    --accent-gold:#FFC94D;
    --danger:#FF6B4A;
    --text:#F3EFFF;
    --text-muted:#9C93C4;
    --surface:rgba(255,255,255,0.06);
    --surface-border:rgba(255,255,255,0.14);
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-body: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{
    height:100%; margin:0; background:var(--bg-deep); color:var(--text);
    font-family:var(--font-body); overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; padding:0; }
  #bgCanvas{ position:fixed; inset:0; z-index:0; }
  .ambient-glow{
    position:fixed; width:60vmax; height:60vmax; border-radius:50%;
    filter:blur(70px); mix-blend-mode:screen; opacity:0.32; pointer-events:none; z-index:0;
    animation:drift 20s ease-in-out infinite alternate;
  }
  .ambient-glow--a{ background:var(--accent-pink); top:-18%; left:-20%; }
  .ambient-glow--b{ background:var(--accent-cyan); bottom:-20%; right:-16%; animation-delay:-10s; }
  @keyframes drift{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(6%,5%) scale(1.1); } }

  #app{
    position:relative; z-index:1; max-width:480px; margin:0 auto;
    height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  }
  .screen{ display:none; flex-direction:column; height:100%; position:relative; }
  .screen.active{ display:flex; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 18px 8px;
  }
  .topbar--garage{ display:grid; grid-template-columns:40px 1fr auto; align-items:center; gap:10px; }
  .topbar--garage h2{ margin:0; font-family:var(--font-display); font-size:18px; font-weight:600; text-align:center; }

  .icon-btn{
    width:40px; height:40px; border-radius:50%; background:var(--surface);
    border:1px solid var(--surface-border); color:var(--text); font-size:18px;
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
  }
  .coin-pill{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface);
    border:1px solid var(--surface-border); padding:7px 13px; border-radius:999px;
    font-family:var(--font-display); font-weight:600; font-size:14px; justify-self:end;
  }
  .coin-icon{ font-size:15px; }

  .home-hero{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; padding:0 24px;
  }
  .game-title{
    font-family:var(--font-display); font-weight:700; font-size:clamp(30px,9vw,42px);
    margin:0; background:linear-gradient(120deg,var(--accent-cyan),var(--accent-pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .best-score{ color:var(--text-muted); font-size:14px; margin:2px 0 0; }
  .best-score strong{ color:var(--accent-gold); font-family:var(--font-display); font-weight:600; }
  #heroCanvas{ margin:8px 0 2px; filter:drop-shadow(0 12px 26px rgba(63,238,224,0.28)); }
  .ship-name{ font-family:var(--font-display); font-weight:600; font-size:20px; margin:0; }

  .home-actions{
    display:flex; flex-direction:column; gap:12px; padding:22px 24px;
    padding-bottom:calc(22px + env(safe-area-inset-bottom));
  }
  .btn{
    border-radius:16px; padding:16px; font-family:var(--font-display); font-weight:600;
    font-size:17px; touch-action:manipulation; text-align:center;
  }
  .btn--primary{
    background:linear-gradient(120deg,var(--accent-pink),#FF6B9C); color:#1A0E33;
    box-shadow:0 10px 24px rgba(255,62,108,0.35);
  }
  .btn--ghost{ background:var(--surface); border:1px solid var(--surface-border); color:var(--text); }

  .garage-grid{
    flex:1; display:grid; grid-template-columns:1fr 1fr; gap:14px;
    padding:16px 18px calc(20px + env(safe-area-inset-bottom)); overflow-y:auto; align-content:start;
  }
  .ship-card{
    background:var(--surface); box-shadow:0 0 0 1px var(--surface-border) inset;
    padding:16px 10px 12px; display:flex; flex-direction:column; align-items:center; gap:4px;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    touch-action:manipulation;
  }
  .ship-card--equipped{ box-shadow:0 0 0 2px var(--ship-color) inset; }
  .ship-card--locked{ opacity:0.72; }
  .ship-card__canvas{ display:block; }
  .ship-card__name{ font-family:var(--font-display); font-weight:600; font-size:14px; margin-top:2px; }
  .ship-card__status{ font-size:11.5px; color:var(--text-muted); font-family:var(--font-display); }
  .ship-card--equipped .ship-card__status{ color:var(--accent-cyan); }
  .shake{ animation:shakeAnim 0.4s; }
  @keyframes shakeAnim{
    10%,90%{ transform:translateX(-1px); } 20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); } 40%,60%{ transform:translateX(4px); }
  }

  #screen-game{ padding:0; }
  #gameCanvas{ position:absolute; inset:0; touch-action:none; }
  .hud{
    position:absolute; top:0; left:0; right:0; z-index:2; display:grid;
    grid-template-columns:1fr auto 1fr; align-items:start;
    padding:calc(12px + env(safe-area-inset-top)) 14px 0; pointer-events:none;
  }
  .hud-left{ display:flex; align-items:center; gap:8px; pointer-events:auto; }
  .hud-center{ justify-self:center; pointer-events:auto; font-size:17px; letter-spacing:2px; padding-top:9px; }
  .hud-right{ justify-self:end; pointer-events:auto; }
  .icon-btn--hud{ background:rgba(11,6,32,0.55); }
  .hud-score, .hud-coins{
    font-family:var(--font-display); font-weight:600; font-size:14px;
    background:rgba(11,6,32,0.55); padding:8px 13px; border-radius:999px;
  }
  .ready-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:30px; font-weight:700; color:var(--text);
    background:rgba(11,6,32,0.35); z-index:3; transition:opacity 0.3s ease;
  }
  .ready-overlay.hide{ opacity:0; }

  #screen-gameover{ align-items:center; justify-content:center; padding:24px; }
  .gameover-card{
    background:var(--surface); border:1px solid var(--surface-border); border-radius:24px;
    padding:34px 28px; text-align:center; width:100%; max-width:340px;
  }
  .gameover-eyebrow{ color:var(--accent-gold); font-family:var(--font-display); font-weight:600; margin:0 0 6px; font-size:13px; }
  .gameover-card h2{ margin:0; font-family:var(--font-display); font-weight:600; font-size:20px; color:var(--text-muted); }
  .gameover-score{
    font-family:var(--font-display); font-size:50px; font-weight:700; margin:10px 0 2px;
    background:linear-gradient(120deg,var(--accent-cyan),var(--accent-pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .gameover-sub{ color:var(--text-muted); margin:0 0 6px; font-size:14px; }
  .gameover-sub strong{ color:var(--text); font-family:var(--font-display); }
  .gameover-coins{ color:var(--accent-gold); font-family:var(--font-display); font-weight:600; margin:0 0 22px; }
  .gameover-actions{ display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="ambient-glow ambient-glow--a"></div>
  <div class="ambient-glow ambient-glow--b"></div>

  <div id="app">
    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <header class="topbar">
        <button id="muteBtn" class="icon-btn" aria-label="Toggle sound">🔊</button>
        <div class="coin-pill"><span class="coin-icon">🪙</span><span id="homeCoins">0</span></div>
      </header>
      <div class="home-hero">
        <h1 class="game-title">Nova Runner</h1>
        <p class="best-score">Best score <strong id="homeHighScore">0</strong></p>
        <canvas id="heroCanvas"></canvas>
        <p class="ship-name" id="homeShipName">Scout</p>
      </div>
      <div class="home-actions">
        <button id="garageBtn" class="btn btn--ghost">Change ship</button>
        <button id="playBtn" class="btn btn--primary">Launch</button>
      </div>
    </section>

    <!-- GARAGE -->
    <section id="screen-garage" class="screen">
      <header class="topbar topbar--garage">
        <button id="backFromGarage" class="icon-btn" aria-label="Back">←</button>
        <h2>Rocket garage</h2>
        <div class="coin-pill"><span class="coin-icon">🪙</span><span id="garageCoins">0</span></div>
      </header>
      <div id="garageGrid" class="garage-grid"></div>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen">
      <canvas id="gameCanvas"></canvas>
      <div class="hud">
        <div class="hud-left">
          <button id="exitGameBtn" class="icon-btn icon-btn--hud" aria-label="Exit run">×</button>
          <div class="hud-score">Score <span id="hudScore">0</span></div>
        </div>
        <div class="hud-center" id="hudLives"></div>
        <div class="hud-right hud-coins"><span class="coin-icon">🪙</span><span id="hudCoins">0</span></div>
      </div>
      <div id="readyOverlay" class="ready-overlay">Get ready</div>
    </section>

    <!-- GAME OVER -->
    <section id="screen-gameover" class="screen">
      <div class="gameover-card">
        <p class="gameover-eyebrow" id="newBestBadge" hidden>New best score</p>
        <h2>Run over</h2>
        <p class="gameover-score" id="finalScore">0</p>
        <p class="gameover-sub">Best <strong id="finalBest">0</strong></p>
        <p class="gameover-coins">+<span id="finalCoins">0</span> coins earned</p>
        <div class="gameover-actions">
          <button id="againBtn" class="btn btn--primary">Play again</button>
          <button id="homeBtn" class="btn btn--ghost">Home</button>
        </div>
      </div>
    </section>
  </div>

<script>
/* ---------- Ship data ---------- */
const ROCKETS = [
  { id:'scout',    name:'Scout',    cost:0,   color:'#4DEEEA', accent:'#F1EEFB', wing:'classic', speed:0.22, fireRate:420, bulletR:4, desc:'Balanced and forgiving.' },
  { id:'falcon',   name:'Falcon',   cost:60,  color:'#FF9F5A', accent:'#FFE3C9', wing:'sleek',   speed:0.30, fireRate:400, bulletR:4, desc:'Quick, tight turns.' },
  { id:'comet',    name:'Comet',    cost:140, color:'#FFD166', accent:'#FFF3D1', wing:'delta',   speed:0.24, fireRate:260, bulletR:4, desc:'Rapid twin cannons.' },
  { id:'vanguard', name:'Vanguard', cost:260, color:'#9B5DE5', accent:'#E7D9FF', wing:'classic', speed:0.20, fireRate:440, bulletR:6, desc:'Heavy plasma rounds.' },
  { id:'nebula',   name:'Nebula',   cost:420, color:'#00F5D4', accent:'#D6FFF7', wing:'sleek',   speed:0.28, fireRate:320, bulletR:5, desc:'Upgraded all-round hull.' },
  { id:'phoenix',  name:'Phoenix',  cost:650, color:'#FF3E6C', accent:'#FFD1DC', wing:'delta',   speed:0.32, fireRate:220, bulletR:5, desc:'The ultimate interceptor.' },
];
function getRocket(id){ return ROCKETS.find(r=>r.id===id) || ROCKETS[0]; }

/* ---------- Profile (persisted) ---------- */
let profile = { coins:0, highScore:0, unlocked:['scout'], selected:'scout', muted:false };

async function loadProfile(){
  try{
    const res = await window.storage.get('profile', false);
    if(res && res.value){ Object.assign(profile, JSON.parse(res.value)); }
  }catch(e){ /* first run, no save yet */ }
  if(!profile.unlocked) profile.unlocked = ['scout'];
  if(!profile.unlocked.includes('scout')) profile.unlocked.push('scout');
  if(!profile.selected) profile.selected = 'scout';
  renderHomeShipInfo();
  document.getElementById('muteBtn').textContent = profile.muted ? '🔇' : '🔊';
}
async function saveProfile(){
  try{ await window.storage.set('profile', JSON.stringify(profile), false); }
  catch(e){ console.error('save failed', e); }
}

/* ---------- Canvas helpers ---------- */
function prepareCanvas(canvas, w, h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}
function shade(hex, amt){
  let col = hex.replace('#','');
  if(col.length===3) col = col.split('').map(c=>c+c).join('');
  const num = parseInt(col,16);
  let r=(num>>16)+amt, g=((num>>8)&255)+amt, b=(num&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

/* ---------- Rocket drawing ---------- */
function drawRocket(ctx, x, y, scale, rocket, opts){
  opts = opts || {};
  const flame = opts.flame == null ? 0.6 : opts.flame;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.lineJoin = 'round';
  const color = rocket.color, accent = rocket.accent;

  const flameLen = 12 + Math.random()*7*flame;
  const grad = ctx.createLinearGradient(0,18,0,18+flameLen);
  grad.addColorStop(0,'rgba(255,214,102,0.95)');
  grad.addColorStop(1,'rgba(255,62,108,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-6,18);
  ctx.quadraticCurveTo(0,18+flameLen,6,18);
  ctx.closePath();
  ctx.fill();

  if(rocket.wing === 'classic'){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,-26);
    ctx.quadraticCurveTo(9,-4,8,14);
    ctx.lineTo(-8,14);
    ctx.quadraticCurveTo(-9,-4,0,-26);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(color,-25);
    ctx.beginPath(); ctx.moveTo(-8,4); ctx.lineTo(-18,18); ctx.lineTo(-6,14); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8,4); ctx.lineTo(18,18); ctx.lineTo(6,14); ctx.closePath(); ctx.fill();
  } else if(rocket.wing === 'delta'){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,-27);
    ctx.lineTo(20,16);
    ctx.lineTo(6,10);
    ctx.lineTo(0,16);
    ctx.lineTo(-6,10);
    ctx.lineTo(-20,16);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,-28);
    ctx.quadraticCurveTo(6,0,5,14);
    ctx.lineTo(-5,14);
    ctx.quadraticCurveTo(-6,0,0,-28);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(color,-25);
    ctx.beginPath(); ctx.moveTo(-5,8); ctx.lineTo(-12,16); ctx.lineTo(-4,13); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5,8); ctx.lineTo(12,16); ctx.lineTo(4,13); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.arc(0,-6,3.6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---------- Starfield background ---------- */
function drawStars(){
  const c = document.getElementById('bgCanvas');
  const ctx = prepareCanvas(c, window.innerWidth, window.innerHeight);
  const w = window.innerWidth, h = window.innerHeight;
  ctx.clearRect(0,0,w,h);
  const n = Math.floor((w*h)/6000);
  for(let i=0;i<n;i++){
    const x=Math.random()*w, y=Math.random()*h, r=Math.random()*1.4+0.2;
    ctx.globalAlpha = Math.random()*0.6+0.25;
    ctx.fillStyle = Math.random()<0.15 ? '#3FEEE0' : '#F3EFFF';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- Hero (home screen) idle animation ---------- */
let heroCtx=null, heroRAF=null, heroStart=null;
const HERO_W=220, HERO_H=250;
function setupHeroCanvas(){
  heroCtx = prepareCanvas(document.getElementById('heroCanvas'), HERO_W, HERO_H);
}
function startHeroLoop(){
  if(heroRAF) return;
  heroStart = performance.now();
  function loop(now){
    const t = (now-heroStart)/1000;
    heroCtx.clearRect(0,0,HERO_W,HERO_H);
    const rocket = getRocket(profile.selected);
    const bob = Math.sin(t*1.6)*8;
    drawRocket(heroCtx, HERO_W/2, HERO_H/2+16+bob, 2.15, rocket, {flame:0.55+Math.sin(t*10)*0.25});
    heroRAF = requestAnimationFrame(loop);
  }
  heroRAF = requestAnimationFrame(loop);
}
function stopHeroLoop(){ if(heroRAF){ cancelAnimationFrame(heroRAF); heroRAF=null; } }

/* ---------- Screen management ---------- */
let currentScreenName = 'home';
function showScreen(name){
  currentScreenName = name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(name==='home'){ startHeroLoop(); renderHomeShipInfo(); }
  else{ stopHeroLoop(); }
  if(name==='garage'){ renderGarage(); }
}

function renderHomeShipInfo(){
  const rocket = getRocket(profile.selected);
  document.getElementById('homeShipName').textContent = rocket.name;
  document.getElementById('homeHighScore').textContent = profile.highScore;
  updateCoinDisplays();
}
function updateCoinDisplays(){
  document.getElementById('homeCoins').textContent = profile.coins;
  document.getElementById('garageCoins').textContent = profile.coins;
}

/* ---------- Garage ---------- */
function renderGarage(){
  const grid = document.getElementById('garageGrid');
  grid.innerHTML = '';
  ROCKETS.forEach(rocket=>{
    const owned = profile.unlocked.includes(rocket.id);
    const equipped = profile.selected === rocket.id;
    const card = document.createElement('button');
    card.className = 'ship-card' + (equipped?' ship-card--equipped':'') + (!owned?' ship-card--locked':'');
    card.dataset.id = rocket.id;
    card.style.setProperty('--ship-color', rocket.color);
    const statusText = equipped ? 'Equipped' : owned ? 'Tap to select' : ('🪙 ' + rocket.cost);
    card.innerHTML =
      '<canvas class="ship-card__canvas" data-canvas="'+rocket.id+'"></canvas>' +
      '<span class="ship-card__name">'+rocket.name+'</span>' +
      '<span class="ship-card__status">'+statusText+'</span>';
    card.addEventListener('click', ()=>onCardTap(rocket));
    grid.appendChild(card);
  });
  ROCKETS.forEach(rocket=>{
    const canvas = grid.querySelector('canvas[data-canvas="'+rocket.id+'"]');
    const ctx = prepareCanvas(canvas, 84, 100);
    const owned = profile.unlocked.includes(rocket.id);
    ctx.save();
    if(!owned) ctx.globalAlpha = 0.4;
    drawRocket(ctx, 42, 56, 1.7, rocket, {flame:0.5});
    ctx.restore();
  });
}
function onCardTap(rocket){
  if(profile.selected === rocket.id) return;
  if(profile.unlocked.includes(rocket.id)){
    profile.selected = rocket.id;
    saveProfile(); renderGarage(); renderHomeShipInfo();
    playSound('select');
  } else if(profile.coins >= rocket.cost){
    profile.coins -= rocket.cost;
    profile.unlocked.push(rocket.id);
    profile.selected = rocket.id;
    saveProfile(); renderGarage(); renderHomeShipInfo();
    playSound('unlock');
  } else {
    shakeCard(rocket.id);
    playSound('error');
  }
}
function shakeCard(id){
  const el = document.querySelector('.ship-card[data-id="'+id+'"]');
  if(!el) return;
  el.classList.add('shake');
  setTimeout(()=>el.classList.remove('shake'), 420);
}

/* ---------- Sound (WebAudio, no assets) ---------- */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
}
function playSound(type){
  if(profile.muted || !audioCtx) return;
  try{
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    let freq=440, dur=0.08, kind='sine';
    if(type==='shoot'){ freq=880; dur=0.05; kind='square'; }
    else if(type==='hit'){ freq=220; dur=0.09; kind='sawtooth'; }
    else if(type==='hurt'){ freq=140; dur=0.25; kind='triangle'; }
    else if(type==='select'){ freq=660; dur=0.08; kind='sine'; }
    else if(type==='unlock'){ freq=990; dur=0.2; kind='sine'; }
    else if(type==='error'){ freq=120; dur=0.12; kind='square'; }
    osc.type = kind; osc.frequency.setValueAtTime(freq,t);
    gain.gain.setValueAtTime(0.0001,t);
    gain.gain.exponentialRampToValueAtTime(0.16,t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.start(t); osc.stop(t+dur+0.02);
  }catch(e){}
}
function toggleMute(){
  profile.muted = !profile.muted;
  document.getElementById('muteBtn').textContent = profile.muted ? '🔇' : '🔊';
  saveProfile();
}

/* ---------- Gameplay ---------- */
let gameCtx=null, logicalW=0, logicalH=0;
let rocket, player, target, bullets, meteors, particles;
let score=0, coinsThisRun=0, lives=3, maxLives=3;
let lastShot=0, spawnTimer=0, spawnInterval=1.15, runStart=0, invulnerableUntil=0;
let ready=false, runActive=false, dragging=false;
let gameRAF=null, lastFrame=null;

function resizeGameCanvas(){
  const canvas = document.getElementById('gameCanvas');
  const rect = canvas.parentElement.getBoundingClientRect();
  logicalW = rect.width; logicalH = rect.height;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = logicalW*dpr; canvas.height = logicalH*dpr;
  canvas.style.width = logicalW+'px'; canvas.style.height = logicalH+'px';
  gameCtx = canvas.getContext('2d');
  gameCtx.setTransform(dpr,0,0,dpr,0,0);
}
function resetRunState(){
  rocket = getRocket(profile.selected);
  target = { x: logicalW/2, y: logicalH*0.78 };
  player = { x: target.x, y: target.y, r: 16 };
  bullets = []; meteors = []; particles = [];
  score = 0; coinsThisRun = 0; lives = 3; maxLives = 3;
  lastShot = 0; spawnTimer = 0; spawnInterval = 1.15; invulnerableUntil = 0;
  ready = false; dragging = false;
  updateHUD();
}
function startRun(){
  showScreen('game');
  resizeGameCanvas();
  resetRunState();
  runActive = true; lastFrame = null;
  gameRAF = requestAnimationFrame(gameLoop);
  showReadyOverlay();
}
function showReadyOverlay(){
  const el = document.getElementById('readyOverlay');
  el.style.display = 'flex'; el.classList.remove('hide');
  setTimeout(()=>{
    el.classList.add('hide');
    setTimeout(()=>{ el.style.display='none'; }, 300);
    ready = true; runStart = performance.now();
  }, 700);
}
function updateHUD(){
  document.getElementById('hudScore').textContent = score;
  document.getElementById('hudCoins').textContent = coinsThisRun;
  document.getElementById('hudLives').textContent = '❤'.repeat(Math.max(lives,0)) + '♡'.repeat(Math.max(maxLives-lives,0));
}
function pickMeteorType(){
  const roll = Math.random();
  if(roll<0.45) return 'small';
  if(roll<0.80) return 'medium';
  return 'large';
}
function spawnMeteor(){
  const type = pickMeteorType();
  let r,vyMin,vyMax,coin,pts_score;
  if(type==='small'){ r=14+Math.random()*4; vyMin=150; vyMax=210; coin=3; pts_score=15; }
  else if(type==='medium'){ r=24+Math.random()*6; vyMin=95; vyMax=140; coin=2; pts_score=10; }
  else{ r=36+Math.random()*10; vyMin=55; vyMax=90; coin=1; pts_score=5; }
  const colors=['#8C7A6B','#6E5C4F','#A6907B','#7A6A8C'];
  const color = colors[Math.floor(Math.random()*colors.length)];
  const pts=[]; const n=8;
  for(let i=0;i<n;i++){ pts.push({ang:(i/n)*Math.PI*2+Math.random()*0.2, rf:0.72+Math.random()*0.42}); }
  meteors.push({
    x: r+Math.random()*(logicalW-2*r), y:-r-10,
    vy: vyMin+Math.random()*(vyMax-vyMin), r, rotation:0,
    rotSpeed:(Math.random()*2-1)*1.2, coin, score:pts_score, color, points:pts
  });
}
function spawnParticles(x,y,color){
  for(let i=0;i<8;i++){
    const ang=Math.random()*Math.PI*2, spd=40+Math.random()*100;
    particles.push({ x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:0.35+Math.random()*0.3, maxLife:0.65, r:2+Math.random()*2, color });
  }
}
function update(dt, now){
  const lerp = Math.min(1, rocket.speed);
  player.x += (target.x-player.x)*lerp;
  player.y += (target.y-player.y)*lerp;

  if(ready){
    spawnTimer += dt;
    if(spawnTimer >= spawnInterval){
      spawnTimer = 0; spawnMeteor();
      const elapsed = (now-runStart)/1000;
      spawnInterval = Math.max(0.38, 1.15 - elapsed*0.012);
    }
    if(now-lastShot >= rocket.fireRate){
      lastShot = now;
      bullets.push({ x:player.x, y:player.y-18, r:rocket.bulletR });
      playSound('shoot');
    }
  }

  for(let i=bullets.length-1;i>=0;i--){ bullets[i].y -= 520*dt; if(bullets[i].y < -20) bullets.splice(i,1); }
  for(let i=meteors.length-1;i>=0;i--){
    const m = meteors[i]; m.y += m.vy*dt; m.rotation += m.rotSpeed*dt;
    if(m.y-m.r > logicalH+30) meteors.splice(i,1);
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i]; let hit=false;
    for(let j=meteors.length-1;j>=0;j--){
      const m = meteors[j]; const dx=b.x-m.x, dy=b.y-m.y; const rr=b.r+m.r;
      if(dx*dx+dy*dy < rr*rr){
        spawnParticles(m.x,m.y,m.color);
        coinsThisRun += m.coin; score += m.score;
        meteors.splice(j,1); hit=true; playSound('hit');
        break;
      }
    }
    if(hit){ bullets.splice(i,1); updateHUD(); }
  }

  if(now > invulnerableUntil){
    for(let j=meteors.length-1;j>=0;j--){
      const m = meteors[j]; const dx=player.x-m.x, dy=player.y-m.y; const rr=(player.r*0.85+m.r*0.7);
      if(dx*dx+dy*dy < rr*rr){
        meteors.splice(j,1);
        lives -= 1; invulnerableUntil = now+1400;
        spawnParticles(player.x,player.y,'#FF6B4A');
        updateHUD(); playSound('hurt');
        if(lives <= 0){ triggerGameOver(); return; }
        break;
      }
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if(p.life <= 0) particles.splice(i,1);
  }
}
function drawMeteor(ctx,m){
  ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(m.rotation);
  ctx.beginPath();
  m.points.forEach((p,i)=>{
    const rad = m.r*p.rf, px=Math.cos(p.ang)*rad, py=Math.sin(p.ang)*rad;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.closePath(); ctx.fillStyle = m.color; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();
}
function drawBullet(ctx,b,color){
  ctx.save();
  ctx.globalAlpha = 0.35; ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(b.x,b.y+10,b.r*0.6,10,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function render(now){
  gameCtx.clearRect(0,0,logicalW,logicalH);
  meteors.forEach(m=>drawMeteor(gameCtx,m));
  bullets.forEach(b=>drawBullet(gameCtx,b,rocket.accent));
  particles.forEach(p=>{
    gameCtx.globalAlpha = Math.max(p.life/p.maxLife,0);
    gameCtx.fillStyle = p.color;
    gameCtx.beginPath(); gameCtx.arc(p.x,p.y,p.r,0,Math.PI*2); gameCtx.fill();
  });
  gameCtx.globalAlpha = 1;
  let alpha = 1;
  if(now < invulnerableUntil){ alpha = (Math.floor(now/100)%2===0) ? 1 : 0.3; }
  gameCtx.globalAlpha = alpha;
  drawRocket(gameCtx, player.x, player.y, 1.05, rocket, {flame:0.7+Math.sin(now/70)*0.25});
  gameCtx.globalAlpha = 1;
}
function gameLoop(now){
  if(!runActive) return;
  if(!lastFrame) lastFrame = now;
  let dt = (now-lastFrame)/1000; lastFrame = now;
  if(dt > 0.05) dt = 0.05;
  update(dt, now);
  render(now);
  gameRAF = requestAnimationFrame(gameLoop);
}
function triggerGameOver(){
  if(!runActive) return;
  runActive = false;
  cancelAnimationFrame(gameRAF);
  const isNew = score > profile.highScore;
  profile.highScore = Math.max(profile.highScore, score);
  profile.coins += coinsThisRun;
  saveProfile();
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = profile.highScore;
  document.getElementById('finalCoins').textContent = coinsThisRun;
  document.getElementById('newBestBadge').hidden = !isNew;
  updateCoinDisplays();
  showScreen('gameover');
}

/* ---------- Input ---------- */
function getCanvasPos(e){
  const canvas = document.getElementById('gameCanvas');
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX-rect.left, y: e.clientY-rect.top };
}
function setTarget(x,y){
  const r = player ? player.r : 16;
  target.x = clamp(x, r, logicalW-r);
  target.y = clamp(y, r, logicalH-r);
}
function onPointerDown(e){
  e.preventDefault(); dragging = true; ensureAudio();
  const p = getCanvasPos(e); setTarget(p.x,p.y);
}
function onPointerMove(e){
  if(!dragging) return; e.preventDefault();
  const p = getCanvasPos(e); setTarget(p.x,p.y);
}
function onPointerUp(){ dragging = false; }

/* ---------- Init ---------- */
function bindUI(){
  document.getElementById('garageBtn').addEventListener('click', ()=>showScreen('garage'));
  document.getElementById('backFromGarage').addEventListener('click', ()=>showScreen('home'));
  document.getElementById('playBtn').addEventListener('click', startRun);
  document.getElementById('exitGameBtn').addEventListener('click', ()=>{ if(runActive) triggerGameOver(); });
  document.getElementById('againBtn').addEventListener('click', startRun);
  document.getElementById('homeBtn').addEventListener('click', ()=>showScreen('home'));
  document.getElementById('muteBtn').addEventListener('click', ()=>{ ensureAudio(); toggleMute(); });

  const canvas = document.getElementById('gameCanvas');
  canvas.addEventListener('pointerdown', onPointerDown, {passive:false});
  canvas.addEventListener('pointermove', onPointerMove, {passive:false});
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  let resizeTimer=null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      drawStars();
      if(currentScreenName==='game') resizeGameCanvas();
    }, 150);
  });
}
async function init(){
  drawStars();
  setupHeroCanvas();
  await loadProfile();
  bindUI();
  showScreen('home');
}
window.addEventListener('DOMContentLoaded', init);
</script>
